[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eqa-agent"
version = "0.1.0"
description = "Enterprise knowledge QA agent: ReAct loop, citation audit, conflict handling, offline mock planner"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
eqa = "eqa.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
